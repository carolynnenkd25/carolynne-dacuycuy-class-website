<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticker Studio</title>
  <link rel="stylesheet" href="javastyle.css">
</head>

<body>
  <main>
    <a class="back-link" href="index.html">← Class homepage</a>

    <h1>⋆⭒˚.⋆ My Color Studio . ݁₊ ⊹</h1>
    <p class="intro">
      Pick a color. Choose a mood. Enjoy! ✧༺♥༻∞
    </p>

    <div class="stage">
      <div id="face">😊</div>
    </div>

    <section class="controls">
      <h2>Choose a color</h2>

      <div class="button-row">
        <button id="pink" class="pink" type="button">Pink</button>
        <button id="yellow" class="yellow" type="button">Yellow</button>
        <button id="blue" class="blue" type="button">Blue</button>
        <button id="purple" class="purple" type="button">Purple</button>
      </div>

      <button id="reset" type="button">Start over</button>
    </section>
  </main>

  <script src="javascript.js"></script>
</body>
</html>
